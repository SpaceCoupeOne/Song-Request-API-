<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REQUESTS.EXE</title>
<style>
  :root{
    --face:#C2E8C6;
    --face-dark:#8FB894;
    --win-shadow:#2E4A33;
    --win-hi:#EFFFF0;
    --neon:#00FF8C;
    --neon-dim:#0B7A48;
    --crt-bg:#031A0E;
    --ink:#0E3B1E;
    --ink-dim:#3E6B4B;
    --field-bg:#DDF7DF;
    --danger:#B8393A;
    --danger-dim:#8A2C2D;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px 64px;
    font-family:"Courier New",Courier,monospace;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 18%, rgba(0,255,140,0.18), transparent 55%),
      repeating-linear-gradient(0deg, rgba(0,255,140,0.08) 0px, rgba(0,255,140,0.08) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(0,255,140,0.08) 0px, rgba(0,255,140,0.08) 1px, transparent 1px, transparent 28px),
      #05130B;
    background-attachment:fixed;
  }

  .app{width:100%;max-width:480px;}

  .win{
    background:var(--face);
    border:2px solid var(--win-hi);
    box-shadow:
      inset 1px 1px 0 var(--win-hi),
      2px 0 0 var(--win-shadow),
      0 2px 0 var(--win-shadow),
      2px 2px 0 var(--win-shadow),
      4px 4px 0 rgba(0,0,0,0.35);
    padding:2px;
  }
  .titlebar{
    background:linear-gradient(90deg,#0B5B33,#00A15C 55%,#00E37E);
    color:#EFFFF0;
    font-weight:bold;
    font-size:13px;
    letter-spacing:0.5px;
    padding:4px 6px 4px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .titlebar-dots{display:flex;gap:4px;}
  .tbtn{
    width:16px;height:14px;
    background:var(--face);
    border:1px solid var(--win-shadow);
    box-shadow:inset 1px 1px 0 var(--win-hi);
    font-size:10px;
    line-height:12px;
    text-align:center;
    color:var(--ink);
    font-family:"Courier New",monospace;
  }
  .win-body{padding:16px 16px 18px;}

  #crtwin{transform-origin:center;}
  @keyframes crt-off{
    0%{transform:scaleY(1) scaleX(1);filter:brightness(1);opacity:1;}
    55%{transform:scaleY(0.025) scaleX(1);filter:brightness(4);opacity:1;}
    100%{transform:scaleY(0.001) scaleX(0.001);filter:brightness(0.3);opacity:0;}
  }
  @keyframes crt-on{
    0%{transform:scaleY(0.001) scaleX(0.001);filter:brightness(4);opacity:0;}
    45%{transform:scaleY(0.025) scaleX(1);filter:brightness(4);opacity:1;}
    100%{transform:scaleY(1) scaleX(1);filter:brightness(1);opacity:1;}
  }
  #crtwin.powering-off{animation:crt-off 0.38s ease-in forwards;}
  #crtwin.powering-on{animation:crt-on 0.38s ease-out forwards;}

  #power-dot{
    display:none;
    width:100%;
    padding:60px 0;
    text-align:center;
    cursor:pointer;
  }
  #power-dot .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--neon);
    box-shadow:0 0 8px rgba(0,255,140,0.7);
    animation:dot-pulse 1.6s ease-in-out infinite;
    margin-bottom:10px;
  }
  #power-dot .hint{display:block;font-size:11px;color:var(--neon-dim);letter-spacing:0.5px;text-transform:uppercase;}
  @keyframes dot-pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}

  .tbtn.close{cursor:pointer;}
  .tbtn.close:hover{background:#F0C0C0;}

  .flip-wrap{margin:0 0 20px;}
  .flip-label-top{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;font-weight:bold;text-align:center;margin:0 0 8px;}
  .flip-row{display:flex;justify-content:center;gap:6px;}
  .flip-unit{display:flex;flex-direction:column;align-items:center;}
  .flip-card{
    background:linear-gradient(to bottom, #062617 0%, #031A0E 48%, #020F07 52%, #041F11 100%);
    color:var(--neon);
    font-family:"Courier New",Courier,monospace;
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
    padding:8px 4px;
    width:46px;
    text-align:center;
    border:2px solid var(--win-shadow);
    border-radius:5px;
    box-shadow:inset 1px 1px 0 rgba(0,0,0,0.5), inset -1px -1px 0 rgba(0,255,140,0.12);
    text-shadow:0 0 6px rgba(0,255,140,0.55);
    position:relative;
    overflow:hidden;
    transform-style:preserve-3d;
  }
  .flip-card::after{
    content:"";
    position:absolute;
    left:0;right:0;top:50%;
    height:2px;
    margin-top:-1px;
    background:rgba(0,0,0,0.65);
    box-shadow:0 1px 0 rgba(0,255,140,0.08);
  }
  @keyframes flip-pulse{
    0%{transform:rotateX(0deg);filter:brightness(1);}
    50%{transform:rotateX(85deg);filter:brightness(2.6);}
    100%{transform:rotateX(0deg);filter:brightness(1);}
  }
  .flip-card.flip{animation:flip-pulse 0.32s ease;}
  .flip-unit-label{font-size:9px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}
  .flip-sep{align-self:center;color:var(--ink-dim);font-size:18px;font-weight:bold;padding-bottom:14px;}

  /* --- signature: CRT queue readout --- */
  .lcd{
    background:var(--crt-bg);
    border:2px solid var(--win-shadow);
    box-shadow:inset 2px 2px 0 rgba(0,0,0,0.5), inset -1px -1px 0 rgba(0,255,140,0.1);
    padding:12px 14px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .lcd::before{
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,255,140,0.06) 0px,
      rgba(0,255,140,0.06) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }
  .lcd-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:1px;color:var(--neon-dim);text-transform:uppercase;}
  .lcd-main{font-size:30px;color:var(--neon);letter-spacing:3px;margin:4px 0 2px;text-shadow:0 0 8px rgba(0,255,140,0.55);}
  .lcd-sub{font-size:12px;color:var(--neon-dim);letter-spacing:0.5px;}
  .lcd-cursor{display:inline-block;width:8px;height:16px;background:var(--neon);margin-left:2px;animation:blink 1.1s steps(1) infinite;vertical-align:-3px;box-shadow:0 0 6px rgba(0,255,140,0.6);}
  @keyframes blink{50%{opacity:0;}}

  h1{font-size:16px;font-weight:bold;letter-spacing:0.5px;margin:0 0 4px;text-transform:uppercase;color:var(--ink);}
  .lede{font-size:12px;color:var(--ink-dim);margin:0 0 18px;line-height:1.5;}

  .tabs{display:none;gap:4px;margin-bottom:18px;}
  .tab-btn{
    flex:1;
    background:var(--face);
    border:1px solid var(--win-shadow);
    box-shadow:inset 1px 1px 0 var(--win-hi), inset -1px -1px 0 var(--face-dark);
    color:var(--ink);
    font-family:"Courier New",monospace;
    font-size:12px;
    font-weight:bold;
    letter-spacing:0.3px;
    padding:9px 6px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .tab-btn.active{
    background:var(--neon-dim);
    color:#EFFFF0;
    box-shadow:inset 1px 1px 0 rgba(0,0,0,0.3), inset -1px -1px 0 rgba(255,255,255,0.15);
  }
  .tab-btn:not(.active):active{box-shadow:inset -1px -1px 0 var(--win-hi), inset 1px 1px 0 var(--face-dark);}

  .panel{display:none;}
  .panel.active{display:block;}

  label{display:block;font-size:11px;color:var(--ink-dim);margin:0 0 5px;font-weight:bold;letter-spacing:0.3px;text-transform:uppercase;}
  .field{margin-bottom:14px;}
  input[type=text]{
    width:100%;
    background:var(--field-bg);
    border:1px solid var(--win-shadow);
    box-shadow:inset 1px 1px 0 rgba(0,0,0,0.25), inset -1px -1px 0 var(--win-hi);
    color:var(--ink);
    font-family:"Courier New",monospace;
    font-size:14px;
    padding:9px 10px;
    outline:none;
  }
  input[type=text]:focus{box-shadow:inset 1px 1px 0 rgba(0,0,0,0.25), inset -1px -1px 0 var(--win-hi), 0 0 0 2px var(--neon-dim);}
  input[type=text]::placeholder{color:#6B9174;}

  .submit-btn{
    width:100%;
    background:var(--face);
    color:var(--ink);
    border:1px solid var(--win-shadow);
    box-shadow:inset 1px 1px 0 var(--win-hi), inset -1px -1px 0 var(--face-dark);
    font-family:"Courier New",monospace;
    font-size:13px;
    font-weight:bold;
    letter-spacing:0.4px;
    text-transform:uppercase;
    padding:11px;
    cursor:pointer;
    margin-top:2px;
  }
  .submit-btn:active{box-shadow:inset -1px -1px 0 var(--win-hi), inset 1px 1px 0 var(--face-dark);}
  .submit-btn:disabled{opacity:0.5;cursor:default;}

  .confirm{
    display:none;
    background:var(--crt-bg);
    border:1px solid var(--win-shadow);
    color:var(--neon);
    font-size:12px;
    font-weight:bold;
    padding:9px 11px;
    margin-top:10px;
    text-shadow:0 0 5px rgba(0,255,140,0.5);
  }

  .queue-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .req-card{
    background:var(--field-bg);
    border:1px solid var(--win-shadow);
    box-shadow:inset 1px 1px 0 var(--win-hi);
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .req-card.added{opacity:0.55;}
  .req-main{min-width:0;}
  .req-song{font-size:13px;font-weight:bold;margin:0 0 2px;word-break:break-word;color:var(--ink);}
  .req-artist{font-size:12px;color:var(--ink-dim);margin:0 0 4px;}
  .req-note{font-size:11px;color:var(--ink-dim);margin:6px 0 0;font-style:italic;}
  .req-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
  .icon-btn{
    background:var(--face);
    border:1px solid var(--win-shadow);
    box-shadow:inset 1px 1px 0 var(--win-hi), inset -1px -1px 0 var(--face-dark);
    color:var(--ink);
    font-family:"Courier New",monospace;
    font-size:10px;
    font-weight:bold;
    letter-spacing:0.3px;
    padding:5px 8px;
    cursor:pointer;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .icon-btn:active{box-shadow:inset -1px -1px 0 var(--win-hi), inset 1px 1px 0 var(--face-dark);}
  .icon-btn.add{color:var(--neon-dim);}
  .icon-btn.del{color:var(--danger-dim);}

  .empty{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
    padding:30px 14px;
    border:1px dashed var(--win-shadow);
  }

  .section-label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:bold;margin:18px 0 8px;}
  .section-label:first-child{margin-top:0;}
</style>
</head>
<body>
<div class="app">
<div class="win" id="crtwin">
  <div class="titlebar">
    <span>REQUESTS.EXE</span>
    <div class="titlebar-dots">
      <span class="tbtn">_</span>
      <span class="tbtn">&#9633;</span>
      <span class="tbtn close" id="btn-close">X</span>
    </div>
  </div>
  <div class="win-body">

  <div class="lcd">
    <div class="lcd-row"><span>Now queued</span><span id="lcd-time">--:--</span></div>
    <div class="lcd-main" id="lcd-count">-- <span class="lcd-cursor"></span></div>
    <div class="lcd-sub" id="lcd-sub">loading...</div>
  </div>

  <h1>Track requests</h1>
  <p class="lede">Drop a song and artist below. When it's loaded onto your Echo Mini, it'll get checked off the queue :)</p>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="request">Request a track</button>
    <button class="tab-btn" data-tab="manage">Manage queue</button>
  </div>

  <div class="panel active" id="panel-request">
    <div class="flip-wrap">
      <div class="flip-label-top" id="flip-label-top">Estimated wait</div>
      <div class="flip-row">
        <div class="flip-unit"><div class="flip-card" id="fc-d">00</div><div class="flip-unit-label">days</div></div>
        <div class="flip-sep">:</div>
        <div class="flip-unit"><div class="flip-card" id="fc-h">00</div><div class="flip-unit-label">hrs</div></div>
        <div class="flip-sep">:</div>
        <div class="flip-unit"><div class="flip-card" id="fc-m">00</div><div class="flip-unit-label">min</div></div>
        <div class="flip-sep">:</div>
        <div class="flip-unit"><div class="flip-card" id="fc-s">00</div><div class="flip-unit-label">sec</div></div>
      </div>
    </div>
    <div class="field">
      <label for="f-song">Song title</label>
      <input type="text" id="f-song" placeholder="e.g. Cherry Wine" maxlength="120">
    </div>
    <div class="field">
      <label for="f-artist">Artist</label>
      <input type="text" id="f-artist" placeholder="e.g. Hozier" maxlength="120">
    </div>
    <div class="field">
      <label for="f-note">Note <span style="text-transform:none;font-weight:normal;">(optional)</span></label>
      <input type="text" id="f-note" placeholder="Specific version, mood, etc." maxlength="140">
    </div>
    <button class="submit-btn" id="submit-btn">Add to queue</button>
    <div class="confirm" id="confirm-msg">Added to the queue.</div>
  </div>

  <div class="panel" id="panel-manage">
    <div id="pending-section">
      <div class="section-label">Pending</div>
      <ul class="queue-list" id="pending-list"></ul>
    </div>
    <div id="added-section">
      <div class="section-label">Already added</div>
      <ul class="queue-list" id="added-list"></ul>
    </div>
  </div>

  </div>
</div>
<div id="power-dot">
  <span class="dot"></span>
  <span class="hint">click to power on</span>
</div>
</div>

<script>
// PASTE YOUR FIREBASE DATABASE URL BELOW, between the quotes.
// Example: 'https://song-requests-xxxxx-default-rtdb.firebaseio.com'
// HOW MANY MINUTES YOU TYPICALLY TAKE TO LOAD ONE SONG ONTO THE DAP.
// The countdown estimates ETA as (pending songs) x (this number).
const MINUTES_PER_SONG = 8;

const FIREBASE_URL = 'https://song-requests-e754a-default-rtdb.firebaseio.com';

const DATA_ENDPOINT = FIREBASE_URL + '/requests.json';
let requests = [];

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

async function loadRequests(){
  if(!FIREBASE_URL){
    console.error('Set FIREBASE_URL at the top of the script.');
    requests = [];
    render();
    return;
  }
  try{
    const res = await fetch(DATA_ENDPOINT);
    const data = await res.json();
    requests = data ? Object.values(data) : [];
  }catch(e){
    requests = [];
  }
  render();
}

async function saveRequests(){
  if(!FIREBASE_URL) return;
  try{
    const obj = {};
    requests.forEach(r => { obj[r.id] = r; });
    await fetch(DATA_ENDPOINT, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj)
    });
  }catch(e){
    console.error('Storage error', e);
  }
}

function render(){
  const pending = requests.filter(r => !r.added).sort((a,b) => b.ts - a.ts);
  const added = requests.filter(r => r.added).sort((a,b) => (b.addedTs||0) - (a.addedTs||0));

  updateSyncEstimate(pending.length);

  document.getElementById('lcd-count').innerHTML = String(pending.length).padStart(2,'0') + ' <span class="lcd-cursor"></span>';
  document.getElementById('lcd-sub').textContent = pending.length === 1 ? '1 track waiting' : pending.length + ' tracks waiting';
  document.getElementById('lcd-time').textContent = added.length + ' loaded';

  const pendingList = document.getElementById('pending-list');
  const addedList = document.getElementById('added-list');
  pendingList.innerHTML = '';
  addedList.innerHTML = '';

  if(pending.length === 0){
    pendingList.innerHTML = '<div class="empty">No pending requests. The queue is clear.</div>';
  } else {
    pending.forEach(r => pendingList.appendChild(buildCard(r, false)));
  }

  if(added.length === 0){
    document.getElementById('added-section').style.display = 'none';
  } else {
    document.getElementById('added-section').style.display = 'block';
    added.forEach(r => addedList.appendChild(buildCard(r, true)));
  }
}

function buildCard(r, isAdded){
  const li = document.createElement('li');
  li.className = 'req-card' + (isAdded ? ' added' : '');

  const main = document.createElement('div');
  main.className = 'req-main';
  main.innerHTML =
    '<p class="req-song">' + escapeHtml(r.song) + '</p>' +
    '<p class="req-artist">' + escapeHtml(r.artist) + '</p>' +
    (r.note ? '<p class="req-note">' + escapeHtml(r.note) + '</p>' : '');

  const actions = document.createElement('div');
  actions.className = 'req-actions';

  if(!isAdded){
    const addBtn = document.createElement('button');
    addBtn.className = 'icon-btn add';
    addBtn.textContent = 'Mark added';
    addBtn.onclick = () => markAdded(r.id);
    actions.appendChild(addBtn);
  }

  const delBtn = document.createElement('button');
  delBtn.className = 'icon-btn del';
  delBtn.textContent = 'Remove';
  delBtn.onclick = () => removeRequest(r.id);
  actions.appendChild(delBtn);

  li.appendChild(main);
  li.appendChild(actions);
  return li;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function markAdded(id){
  const r = requests.find(x => x.id === id);
  if(r){ r.added = true; r.addedTs = Date.now(); }
  render();
  await saveRequests();
}

function startLiveUpdates(){
  if(!FIREBASE_URL || typeof EventSource === 'undefined') return;
  try{
    const stream = new EventSource(DATA_ENDPOINT);
    stream.addEventListener('put', (e) => {
      try{
        const parsed = JSON.parse(e.data);
        if(parsed.path === '/'){
          requests = parsed.data ? Object.values(parsed.data) : [];
          render();
        }
      }catch(err){}
    });
  }catch(err){
    console.error('Live updates unavailable', err);
  }
}

async function removeRequest(id){
  requests = requests.filter(x => x.id !== id);
  render();
  await saveRequests();
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  const song = document.getElementById('f-song').value.trim();
  const artist = document.getElementById('f-artist').value.trim();
  const note = document.getElementById('f-note').value.trim();

  if(!song || !artist){
    alert('Song title and artist are required.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  requests.push({
    id: uid(),
    song, artist, note,
    added: false,
    ts: Date.now()
  });
  await saveRequests();

  document.getElementById('f-song').value = '';
  document.getElementById('f-artist').value = '';
  document.getElementById('f-note').value = '';

  const confirmMsg = document.getElementById('confirm-msg');
  confirmMsg.style.display = 'block';
  setTimeout(() => { confirmMsg.style.display = 'none'; }, 2500);

  btn.disabled = false;
  render();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'manage'){ render(); }
  });
});

let syncTargetMs = Date.now();
let lastPendingCount = -1;

function updateSyncEstimate(pendingCount){
  if(pendingCount === lastPendingCount) return;
  lastPendingCount = pendingCount;
  syncTargetMs = Date.now() + pendingCount * MINUTES_PER_SONG * 60000;
  const label = document.getElementById('flip-label-top');
  if(label){
    label.textContent = pendingCount === 0 ? 'Queue clear' : 'Estimated wait';
  }
}

function setFlipDigit(id, value){
  const el = document.getElementById(id);
  const padded = String(value).padStart(2, '0');
  if(el.textContent !== padded){
    el.textContent = padded;
    el.classList.remove('flip');
    void el.offsetWidth;
    el.classList.add('flip');
  }
}

function tickCountdown(){
  const diffRaw = syncTargetMs - Date.now();
  let diff = Math.max(0, diffRaw);

  const d = Math.floor(diff / 86400000);
  diff -= d * 86400000;
  const h = Math.floor(diff / 3600000);
  diff -= h * 3600000;
  const m = Math.floor(diff / 60000);
  diff -= m * 60000;
  const s = Math.floor(diff / 1000);

  setFlipDigit('fc-d', d);
  setFlipDigit('fc-h', h);
  setFlipDigit('fc-m', m);
  setFlipDigit('fc-s', s);
}

tickCountdown();
setInterval(tickCountdown, 1000);

loadRequests();

if(window.location.hash === '#manage'){
  document.getElementById('tabs').style.display = 'flex';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="manage"]').classList.add('active');
  document.getElementById('panel-manage').classList.add('active');
  startLiveUpdates();
}

const crtwin = document.getElementById('crtwin');
const powerDot = document.getElementById('power-dot');

document.getElementById('btn-close').addEventListener('click', () => {
  crtwin.classList.remove('powering-on');
  crtwin.classList.add('powering-off');
});

crtwin.addEventListener('animationend', (e) => {
  if(e.animationName === 'crt-off'){
    crtwin.style.display = 'none';
    powerDot.style.display = 'block';
  } else if(e.animationName === 'crt-on'){
    crtwin.classList.remove('powering-on');
  }
});

powerDot.addEventListener('click', () => {
  powerDot.style.display = 'none';
  crtwin.style.display = 'block';
  crtwin.classList.remove('powering-off');
  void crtwin.offsetWidth;
  crtwin.classList.add('powering-on');
});
</script>
</body>
</html>
